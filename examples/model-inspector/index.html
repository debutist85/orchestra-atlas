<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model inspector — standalone example</title>
    <style>
      body { margin: 0; font: 16px system-ui; background: #eee; color: #222; }
      form, nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
      input { flex: 1; min-width: 180px; }
      button, input { min-height: 44px; font: inherit; }
      #viewer { width: 100%; height: 65vh; }
      #viewer canvas { display: block; }
      #status { padding: 0 12px; }
    </style>
  </head>
  <body>
    <form id="load"><label for="url">GLTF / GLB URL</label><input id="url" type="url" required /><button>Load</button></form>
    <p id="status" role="status">Provide a model URL. Drag to rotate; scroll or pinch to zoom.</p>
    <nav aria-label="Model controls">
      <button id="left">Rotate left</button><button id="right">Rotate right</button>
      <button id="closer">Zoom in</button><button id="farther">Zoom out</button>
      <button id="fit">Fit model</button><button id="cancel">Cancel loading</button>
    </nav>
    <div id="viewer" role="img" aria-label="Interactive 3D model; use the controls above to rotate and zoom"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
